services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scad_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-scad_inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD.}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Scad.Inventory.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-scad_inventory};Username=${POSTGRES_USER:-scad_inventory};Password=${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD.}
      Jwt__Issuer: ${JWT_ISSUER:-scad-inventory-api}
      Jwt__Audience: ${JWT_AUDIENCE:-scad-inventory-ui}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Copy .env.example to .env and set JWT_SIGNING_KEY.}
      Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-60}
    ports:
      - "${API_PORT:-5097}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
